groups:
  - name: ticketory
    rules:
      - alert: TicketoryApiDown
        expr: up{job="ticketory-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ticketory API instance is down"
          description: "{{ $labels.instance }} has been down for more than one minute."

      - alert: TicketoryHigh5xxRate
        expr: |
          sum(rate(http_requests_received_total{job="ticketory-api",code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_received_total{job="ticketory-api"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate on Ticketory API"
          description: "More than 5% of API requests are failing with 5xx responses."

      - alert: RabbitMqQueueBacklog
        expr: rabbitmq_queue_messages{queue=~"ticketory.*"} > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue backlog"
          description: "Queue {{ $labels.queue }} has more than 50 messages waiting."

      - alert: TicketoryExporterDown
        expr: up{job=~"postgres-exporter|redis-exporter|rabbitmq"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Infrastructure exporter is down"
          description: "{{ $labels.job }} ({{ $labels.instance }}) is not being scraped."
