name: ticketory

x-app-environment: &app-environment
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  Database__Password: ${POSTGRES_PASSWORD}
  Redis__Password: ${REDIS_PASSWORD}
  RabbitMq__Password: ${RABBITMQ_PASSWORD}
  Jwt__Secret: ${JWT_SECRET}
  Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
  Seed__OrganizerPassword: ${SEED_ORGANIZER_PASSWORD}
  Seed__CustomerPassword: ${SEED_CUSTOMER_PASSWORD}
  ExternalTools__GrafanaUrl: ${EXTERNAL_TOOLS_GRAFANA_URL:-http://localhost:3000}
  ExternalTools__DozzleUrl: ${EXTERNAL_TOOLS_DOZZLE_URL:-http://localhost:8888}
  ExternalTools__RabbitMqUrl: ${EXTERNAL_TOOLS_RABBITMQ_URL:-http://localhost:15672}
  ExternalTools__PrometheusUrl: ${EXTERNAL_TOOLS_PROMETHEUS_URL:-http://localhost:9090}
  ExternalTools__MailpitUrl: ${EXTERNAL_TOOLS_MAILPIT_URL:-http://localhost:8025}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketory
      POSTGRES_USER: ticketory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketory -d ticketory"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ticketory
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "15672:15672"
      - "15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - internal
    restart: unless-stopped

  api-1:
    build:
      context: .
      dockerfile: src/Ticketory.Api/Dockerfile
    environment:
      <<: *app-environment
      Instance__Id: api-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - edge
      - internal
    restart: unless-stopped

  api-2:
    build:
      context: .
      dockerfile: src/Ticketory.Api/Dockerfile
    environment:
      <<: *app-environment
      Instance__Id: api-2
      Database__InitializeOnStartup: "false"
    depends_on:
      api-1:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - edge
      - internal
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/Ticketory.Worker/Dockerfile
    environment:
      <<: *app-environment
      Instance__Id: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - internal
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://ticketory:${POSTGRES_PASSWORD}@postgres:5432/ticketory?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - monitoring
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
      - monitoring
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:v8.9.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

networks:
  edge:
  internal:
  monitoring:
